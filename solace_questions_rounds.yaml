          - Only for Guaranteed messages
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: bridges

      - text: How are topic subscriptions applied to bridges?
        choices:
          - All topics are bridged automatically
          - Specific topic subscriptions filter what messages are bridged
          - Topics cannot be used with bridges
          - Only wildcard topics work
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: bridges

      - text: Can you have multiple bridges from one VPN?
        choices:
          - No, only one bridge per VPN
          - Yes, multiple bridges to different destinations
          - Only two bridges
          - Only in enterprise edition
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: bridges

      - text: Can bridges be used between cloud and on-premises brokers?
        choices:
          - No, only same environment
          - Yes, bridges work across any network-connected brokers
          - Only with special licensing
          - Only with hardware brokers
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: bridges

      - text: What happens to messages when a bridge connection fails?
        choices:
          - Messages are lost
          - Messages are spooled until the bridge reconnects
          - Messages are returned to sender
          - The broker shuts down
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: bridges

      - text: Can bridges support both TCP and TLS connections?
        choices:
          - Only TCP
          - Only TLS
          - Yes, both TCP and TLS
          - Neither
        correctIndex: 2
        timeLimit: 30
        difficulty: easy
        category: bridges

  - name: "Round 8: DMR (Dynamic Message Routing)"
    questions:
