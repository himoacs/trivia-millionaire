          - The local broker crashes
          - All bridges stop
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: bridges

      - text: Can bridges use TLS encryption?
        choices:
          - No, bridges are internal only
          - Yes, TLS can secure bridge connections
