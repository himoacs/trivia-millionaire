          - Number of recovery points
          - Processing objective
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: dr

      - text: What is RTO (Recovery Time Objective)?
        choices:
          - Data loss limit
          - Maximum acceptable downtime during recovery
