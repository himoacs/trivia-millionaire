        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: ha

  - name: "Round 10: Disaster Recovery"
    questions:
      - text: What is Disaster Recovery (DR) in the context of Solace?
        choices:
          - Backing up configuration files
          - Replicating data to a remote site for catastrophic failure recovery
          - Restarting brokers
          - Message compression
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: dr

      - text: What is the difference between HA and DR?
        choices:
