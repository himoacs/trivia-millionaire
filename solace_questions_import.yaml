rounds:
  - name: Solace Trivia Questions
    questions:
      # SOLACE OVERVIEW
      - text: What is Solace primarily used for?
        choices:
          - Database management
          - Event-driven messaging and streaming
          - Web hosting
          - File storage
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What messaging pattern does Solace support?
        choices:
          - Only point-to-point
          - Only publish-subscribe
          - Publish-subscribe, point-to-point, and request/reply
          - Neither
        correctIndex: 2
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is a Message VPN in Solace?
        choices:
          - A virtual private network for security
          - An isolated messaging domain within a broker
          - A backup message storage
          - A type of encryption protocol
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: Which of these is NOT a Solace deployment option?
        choices:
          - Software broker
          - Hardware appliance
          - Cloud service (Solace Cloud)
          - Browser plugin
        correctIndex: 3
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the main benefit of event-driven architecture?
        choices:
          - Tighter coupling between services
          - Loose coupling and real-time data flow
          - Slower data processing
          - Reduced scalability
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is Solace PubSub+ Cloud?
        choices:
          - A desktop application
          - A fully managed event broker service
          - A hardware appliance
          - A database service
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: In Solace, what role does a producer play?
        choices:
          - Receives messages from topics
          - Publishes messages to topics or queues
          - Manages broker configuration
          - Stores messages permanently
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the role of a consumer in Solace messaging?
        choices:
          - Creates topics and queues
          - Receives and processes messages
          - Configures the broker
          - Monitors network traffic
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is event mesh?
        choices:
          - A single event broker
          - A network of interconnected event brokers
          - A type of message format
          - A security protocol
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the primary function of an event broker?
        choices:
          - Store data permanently
          - Route messages between producers and consumers
          - Generate random events
          - Compress network traffic
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: Solace event broker is designed for which use case?
        choices:
          - Only batch processing
          - Only web applications
          - Real-time event streaming and messaging
          - Only mobile apps
        correctIndex: 2
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is a key advantage of using Solace over traditional messaging?
        choices:
          - Only supports one protocol
          - Multi-protocol support and high performance
          - Requires manual message routing
          - Limited scalability
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What type of applications benefit most from Solace?
        choices:
          - Static websites
          - Real-time, event-driven applications
          - Offline-only applications
          - Simple calculators
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is a best practice for designing topic hierarchies?
        choices:
          - Use random strings
          - Organize hierarchically from general to specific (e.g., region/country/city)
          - Use only single-level topics
          - Always use wildcards
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: overview

      - text: What is the benefit of using an event broker like Solace?
        choices:
          - Direct database access
          - Decoupling producers and consumers
          - Faster CPU processing
          - Reduced disk storage
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What does "fan-out" mean in messaging?
        choices:
          - Sending a message to a single consumer
          - Distributing a message to multiple consumers simultaneously
          - Compressing messages
          - Encrypting messages
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is a subscription in Solace?
        choices:
          - A payment plan
          - A declaration of interest in receiving messages on certain topics
          - A type of network connection
          - A security certificate
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the difference between a topic and a queue in messaging?
        choices:
          - Topics are faster than queues
          - Topics broadcast to all subscribers; queues deliver to one consumer
          - Queues are only for cloud deployments
          - There is no difference
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the purpose of a Message VPN in Solace?
        choices:
          - Encrypt network traffic
          - Provide logical separation of messaging resources
          - Speed up message delivery
          - Compress messages
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What type of architecture does Solace support for cloud deployments?
        choices:
          - Only on-premises
          - Only single cloud
          - Hybrid and multi-cloud
          - Only private cloud
        correctIndex: 2
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the main benefit of asynchronous messaging?
        choices:
          - Guaranteed immediate response
          - Decoupling of sender and receiver timing
          - Lower memory usage
          - Faster encryption
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What does "real-time" mean in the context of event-driven systems?
        choices:
          - Processing happens at a fixed schedule
          - Events are processed as soon as they occur with minimal delay
          - All processing happens at midnight
          - Events are batched weekly
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: Why would you choose Solace over simple HTTP APIs for communication?
        choices:
          - HTTP is always faster
          - Solace enables async, decoupled communication with persistence and reliability
          - HTTP cannot transfer data
          - Solace is always free
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the Solace Event Portal used for?
        choices:
          - Monitoring server hardware
          - Designing, documenting, and discovering events and applications
          - Compressing message payloads
          - Encrypting data at rest
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: overview

      - text: What is the difference between event-driven choreography and orchestration?
        choices:
          - They are the same
          - Choreography is decentralized (services react to events); orchestration is centralized (controller directs)
          - Choreography is slower
          - Orchestration uses topics, choreography uses queues
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      - text: What is the recommended hub-and-spoke event mesh topology?
        choices:
          - All brokers connect to all others
          - Regional brokers connect to a central hub broker for cross-region traffic
          - Single broker only
          - Each application has its own broker
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      - text: What is Message VPN segmentation used for?
        choices:
          - Improving performance only
          - "Logical multi-tenancy: isolating different applications, teams, or customers"
          - Message compression
          - Load balancing
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      - text: What determines the maximum number of client connections per Message VPN?
        choices:
          - Always unlimited
          - Configurable limits based on broker resources and licensing
          - Fixed at 1000 connections
          - Fixed at 100 connections
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      - text: What is the purpose of client username and client profile separation in Solace?
        choices:
          - They are the same thing
          - Usernames authenticate identity; profiles define authorization and resource limits
          - Profiles are only for administrators
          - Usernames set message priority
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      - text: What are event mesh data governance policies used for?
        choices:
          - Improving message speed
          - Enforcing rules about which events can flow between domains and regions
          - Compressing messages
          - Only for billing purposes
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      - text: What is the Solace Event Portal runtime governance feature?
        choices:
          - Code compilation
          - Comparing actual runtime message flows against designed event architecture
          - Database management
          - Network monitoring only
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      - text: What is the recommended topic namespace strategy for enterprise-scale deployments?
        choices:
          - Single flat namespace
          - Hierarchical with domain/application/object/action/version structure
          - Random topic names
          - Numeric IDs only
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: overview

      # MESSAGE DELIVERY
      - text: What are the two main message delivery modes in Solace?
        choices:
          - Fast and Slow
          - Direct and Guaranteed
          - Sync and Async
          - Push and Pull
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: delivery

      - text: What are the two acknowledgment modes for Guaranteed messaging flows?
        choices:
          - Sync and Async
          - Auto-acknowledgment and Client acknowledgment
          - Direct and Guaranteed
          - Persistent and Non-persistent
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What happens to a Direct message if no subscriber is available?
        choices:
          - It is queued for later
          - It is discarded
          - It is sent to a dead letter queue
          - It triggers an error
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: Which delivery mode has lower latency?
        choices:
          - Guaranteed messaging
          - Direct messaging
          - Both have the same latency
          - It depends on message size only
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: In Guaranteed messaging, where are messages stored?
        choices:
          - Only in client memory
          - In broker queues or endpoints
          - In external databases
          - In temporary files
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is an acknowledgment (ACK) in Guaranteed messaging?
        choices:
          - A message priority indicator
          - Confirmation that a message was received
          - A message encryption method
          - A topic subscription
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: When should you use Direct messaging?
        choices:
          - For critical financial transactions
          - For high-throughput, loss-tolerant data like market ticks
          - When messages must never be lost
          - For audit logging
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is message spooling in Solace?
        choices:
          - Compressing messages
          - Storing messages on disk for Guaranteed delivery
          - Encrypting messages
          - Routing messages to multiple topics
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: Does Solace support message priority?
        choices:
          - No, all messages are equal priority
          - Yes, messages can have priority levels 0-9
          - Only for Direct messages
          - Only in cloud deployments
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: In Guaranteed messaging, what happens if a consumer disconnects?
        choices:
          - Messages are lost
          - Messages remain in the queue for redelivery
          - The broker discards the queue
          - All publishers are notified
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is the default message delivery mode for topic subscriptions?
        choices:
          - Guaranteed delivery
          - Direct delivery
          - Transacted delivery
          - No default exists
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: How does Solace achieve Guaranteed messaging?
        choices:
          - By using topics only
          - By using queues and persistent storage
          - By sending messages multiple times
          - By using encrypted connections
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is publisher acknowledgment?
        choices:
          - Consumer confirming receipt
          - Broker confirming message was spooled
          - Topic creation confirmation
          - VPN setup confirmation
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: Which delivery mode is best for IoT sensor data that arrives frequently?
        choices:
          - Guaranteed - every reading must be saved
          - Direct - high volume, latest data matters most
          - Neither mode works for IoT
          - Only batch mode
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What happens when a Guaranteed message expires?
        choices:
          - It is sent to all subscribers
          - It may be moved to a Dead Message Queue
          - It is automatically resent
          - The broker restarts
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is the ingress flow in Solace?
        choices:
          - Messages going out from the broker
          - Messages coming into the broker from publishers
          - Internal broker processing
          - Management API calls
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: delivery

      - text: What is the difference between transacted and non-transacted sessions?
        choices:
          - Transacted sessions are faster
          - Transacted sessions group operations for atomic commit/rollback
          - Non-transacted sessions use more memory
          - There is no difference
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: delivery

      - text: What happens when a queue reaches its maximum spool usage?
        choices:
          - New messages are automatically compressed
          - The broker restarts
          - New messages may be rejected based on reject policy
          - Messages are encrypted
        correctIndex: 2
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is the purpose of message eliding?
        choices:
          - Compress large messages
          - Drop outdated messages when newer ones arrive for same topic
          - Encrypt sensitive data
          - Route messages to backup queues
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: delivery

      - text: What is a Solace flow?
        choices:
          - Network traffic path
          - A session binding to a topic endpoint or queue for consuming messages
          - Message routing diagram
          - Performance monitoring tool
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is the purpose of the redelivery flag on a message?
        choices:
          - To indicate message priority
          - To indicate the message has been delivered before but not acknowledged
          - To compress the message
          - To encrypt the message
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What does "at-most-once" delivery guarantee mean?
        choices:
          - Message is delivered exactly once
          - Message may be lost but never duplicated
          - Message is delivered multiple times
          - Message is always delivered
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is the purpose of consumer acknowledgment modes?
        choices:
          - To speed up delivery
          - To control when messages are removed from the queue
          - To compress messages
          - To encrypt acknowledgments
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is windowed acknowledgment?
        choices:
          - Acknowledging messages through a GUI
          - Acknowledging multiple messages in batches for efficiency
          - Acknowledging to a window service
          - Visual confirmation of delivery
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: delivery

      - text: What is the egress flow in Solace?
        choices:
          - Messages going into the broker
          - Messages going out from the broker to consumers
          - Internal broker processing
          - Management traffic
        correctIndex: 1
        timeLimit: 30
        difficulty: easy
        category: delivery

      - text: How is message TTL (Time To Live) configured?
        choices:
          - Only at broker level
          - Per-message, per-queue, or globally on broker
          - Only by the consuming client
          - TTL cannot be configured
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: delivery

      - text: What is backpressure in messaging systems?
        choices:
          - Network latency
          - A mechanism to slow producers when consumers cannot keep up
          - Data compression
          - Message encryption
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: delivery

      - text: What is the publisher flow control window in guaranteed messaging?
        choices:
          - Window size has no effect
          - Limits outstanding unacknowledged published messages before blocking publisher
          - Controls message size
          - Only for Direct messages
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: delivery

      - text: What is the primary latency difference between Direct and Guaranteed messaging?
        choices:
          - Direct is always slower
          - Direct has lower latency as messages stay in memory; Guaranteed writes to disk
          - Both have identical latency
          - Guaranteed is faster due to batching
        correctIndex: 1
        timeLimit: 30
        difficulty: hard
        category: delivery

      # PROTOCOLS & APIS
