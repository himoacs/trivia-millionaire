          - Full protocol support including transactions and message routing
          - AMQP is not supported
          - AMQP requires protocol conversion
        correctIndex: 1
        timeLimit: 30
        difficulty: medium
        category: protocols

      - text: Does Solace support the AMQP protocol?
        choices:
